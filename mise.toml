[tools]
node = "22"
pnpm = "12.18.0"

[tasks.check]
description = "Линтер, проверка типов и дымовой тест бэкенда"
run = ["pnpm lint", "pnpm typecheck", "pnpm test"]

[tasks."test:e2e"]
description = "End-to-end тесты фронтенда через Playwright"
run = "pnpm test:e2e"

[tasks."docker:build"]
description = "Собрать Docker-образ приложения"
run = "pnpm docker:build"

[tasks."docker:run"]
description = "Запустить приложение в Docker-контейнере"
run = "pnpm docker:run"

[tasks.dev]
description = "Запуск бэкенда и фронтенда одновременно"
run = "pnpm -r --parallel dev"

[tasks."dev:backend"]
description = "Запуск только бэкенда"
run = "pnpm --filter @app/backend dev"

[tasks."dev:frontend"]
description = "Запуск только фронтенда"
run = "pnpm --filter @app/frontend dev"
