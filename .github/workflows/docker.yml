name: Docker

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t calendar-booking:ci .

      - name: Smoke test the container
        run: |
          docker run --rm -d --name calendar-booking-ci -p 3000:3000 calendar-booking:ci
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 http://localhost:3000/ > /tmp/calendar-index.html
          grep -q 'Календарь звонков' /tmp/calendar-index.html
          curl --fail --silent --show-error http://localhost:3000/api/reserve | grep -q 'Reserved'

      - name: Stop container
        if: ${{ always() }}
        run: docker rm -f calendar-booking-ci || true
